<text x="40" y="842" font-size="14" fill="#1F1F1F"><tspan font-weight="600">Simple Change = Yes</tspan> (IT / organisational): same workflow, no Evaluation, D&amp;A checklist.   <tspan font-weight="600">Temporary Change = Yes</tspan>: Change Expiry mandatory; closure requires scheduling of permanent MOC.   All mandated items must be completed before moving to the next stage.</text>
<text x="40" y="866" font-size="14" fill="#7F7F7F">* PSSR mandatory for Moderate/Major only — to be confirmed. TM re-approval at later stages and emergency regularisation — open points. Ad hoc approvals can be added at any stage. MOC Task / MOC Approval sub-workflows unchanged (OOTB).</text>
